<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e67e22">
    <title>ArrendaMoz - Entrar / Criar Conta</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==================== RESET ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8edf5 0%, #d5dce6 100%);
            padding: 20px;
        }
        
        .auth-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 45px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.5s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ==================== LOGO ==================== */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #1a3a5c, #2c5f8a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .logo h1 span {
            background: linear-gradient(135deg, #e67e22, #d35400);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .logo p {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 4px;
        }
        
        .logo p i {
            color: #e67e22;
        }
        
        /* ==================== MENSAGEM ==================== */
        .mensagem {
            padding: 12px 16px;
            border-radius: 12px;
            margin: 10px 0 20px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            animation: fadeSlide 0.3s ease;
        }
        
        .mensagem.erro {
            display: block;
            background: #fadbd8;
            color: #7a1a1a;
            border-left: 4px solid #e74c3c;
        }
        
        .mensagem.sucesso {
            display: block;
            background: #d5f5e3;
            color: #1a5a3a;
            border-left: 4px solid #27ae60;
        }
        
        .mensagem.info {
            display: block;
            background: #d6eaf8;
            color: #1a3a5c;
            border-left: 4px solid #3498db;
        }
        
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ==================== TABS ==================== */
        .tab-auth {
            display: flex;
            gap: 6px;
            margin-bottom: 25px;
            padding: 6px;
            background: #f0f2f5;
            border-radius: 14px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        
        .tab-auth button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            color: #5a6a7a;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .tab-auth button i {
            font-size: 16px;
        }
        
        .tab-auth button.active {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.35);
        }
        
        .tab-auth button:hover:not(.active) {
            background: rgba(230, 126, 34, 0.08);
            color: #2c3e50;
        }
        
        /* ==================== TAB PANELS ==================== */
        .tab-panel {
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        
        .tab-panel.active {
            display: block;
        }
        
        /* ==================== FORMULÁRIO ==================== */
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #2c3e50;
            margin-bottom: 6px;
        }
        
        .form-group label i {
            color: #e67e22;
            margin-right: 6px;
            width: 18px;
        }
        
        .form-group label .required {
            color: #e74c3c;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8edf5;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: #fafbfc;
            color: #2c3e50;
        }
        
        .form-group input:focus {
            border-color: #e67e22;
            outline: none;
            box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.1);
            background: white;
        }
        
        .form-group input::placeholder {
            color: #bdc3c7;
        }
        
        /* ==================== BOTÕES ==================== */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.35);
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(230, 126, 34, 0.45);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.35);
        }
        
        .btn-secondary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(52, 152, 219, 0.45);
        }
        
        .btn-outline {
            background: transparent;
            color: #5a6a7a;
            border: 2px solid #e8edf5;
        }
        
        .btn-outline:hover {
            background: #f8f9fa;
            border-color: #bdc3c7;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #27ae60, #1e8449);
            color: white;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.35);
        }
        
        .btn-success:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(39, 174, 96, 0.45);
        }
        
        /* ==================== DIVIDER ==================== */
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e8edf5;
        }
        
        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #7f8c8d;
            font-size: 13px;
        }
        
        /* ==================== CHECKBOX ==================== */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 10px 0 18px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            min-width: 18px;
            accent-color: #e67e22;
            margin-top: 2px;
            cursor: pointer;
        }
        
        .checkbox-group label {
            font-size: 13px;
            color: #5a6a7a;
            line-height: 1.5;
            cursor: pointer;
        }
        
        .checkbox-group label a {
            color: #e67e22;
            text-decoration: none;
            font-weight: 600;
        }
        
        .checkbox-group label a:hover {
            text-decoration: underline;
        }
        
        /* ==================== CÓDIGO DE VERIFICAÇÃO ==================== */
        .codigo-container {
            display: none;
            animation: fadeIn 0.3s ease;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #e8edf5;
        }
        
        .codigo-container.show {
            display: block;
        }
        
        .codigo-container .info-text {
            text-align: center;
            color: #5a6a7a;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .codigo-container .info-text i {
            color: #e67e22;
            font-size: 18px;
            display: block;
            margin-bottom: 6px;
        }
        
        .codigo-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }
        
        .codigo-inputs input {
            width: 52px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border: 2px solid #e8edf5;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            background: #fafbfc;
            color: #1a3a5c;
        }
        
        .codigo-inputs input:focus {
            border-color: #e67e22;
            box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.1);
            background: white;
        }
        
        .codigo-inputs input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .timer {
            text-align: center;
            font-size: 14px;
            color: #7f8c8d;
            margin: 10px 0 15px;
        }
        
        .timer strong {
            color: #e67e22;
            font-weight: 700;
        }
        
        .voltar-link {
            text-align: center;
            margin-top: 15px;
        }
        
        .voltar-link a {
            color: #7f8c8d;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
        }
        
        .voltar-link a:hover {
            color: #e67e22;
        }
        
        .voltar-link a i {
            margin-right: 6px;
        }
        
        /* ==================== LINK ESQUECEU SENHA ==================== */
        .forgot-link {
            text-align: right;
            margin-top: 4px;
        }
        
        .forgot-link a {
            color: #7f8c8d;
            font-size: 12px;
            text-decoration: none;
            font-weight: 500;
        }
        
        .forgot-link a:hover {
            color: #e67e22;
        }
        
        /* ==================== RESPONSIVO ==================== */
        @media (max-width: 520px) {
            .auth-container {
                padding: 25px 20px;
                border-radius: 24px;
            }
            
            .logo h1 {
                font-size: 26px;
            }
            
            .tab-auth button {
                font-size: 12px;
                padding: 10px 12px;
            }
            
            .tab-auth button span {
                display: none;
            }
            
            .codigo-inputs {
                gap: 6px;
            }
            
            .codigo-inputs input {
                width: 44px;
                height: 52px;
                font-size: 20px;
            }
        }
        
        @media (max-width: 380px) {
            .codigo-inputs {
                gap: 4px;
            }
            
            .codigo-inputs input {
                width: 38px;
                height: 46px;
                font-size: 18px;
            }
            
            .auth-container {
                padding: 20px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- ==================== LOGO ==================== -->
        <div class="logo">
            <h1>Arrenda<span>Moz</span></h1>
            <p><i class="fas fa-gavel"></i> Sistema Inteligente de Contratos</p>
        </div>
        
        <!-- ==================== MENSAGEM ==================== -->
        <div id="mensagem" class="mensagem"></div>
        
        <!-- ==================== TABS ==================== -->
        <div class="tab-auth" id="tabAuth">
            <button class="active" data-tab="login" onclick="mudarTab('login')">
                <i class="fas fa-sign-in-alt"></i> <span>Entrar</span>
            </button>
            <button data-tab="registro" onclick="mudarTab('registro')">
                <i class="fas fa-user-plus"></i> <span>Criar Conta</span>
            </button>
        </div>
        
        <!-- ==================== TAB LOGIN ==================== -->
        <div id="tabLogin" class="tab-panel active">
            <form id="formLogin" onsubmit="event.preventDefault(); loginUsuario();">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email <span class="required">*</span></label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Senha <span class="required">*</span></label>
                    <input type="password" id="loginSenha" placeholder="••••••••" required autocomplete="current-password">
                </div>
                
                <div class="forgot-link">
                    <a href="#" onclick="alert('Entre em contato com o suporte para recuperar sua senha.'); return false;">
                        Esqueceu a senha?
                    </a>
                </div>
                
                <button type="submit" class="btn btn-primary" id="btnLogin">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>
            
            <div class="divider"><span>ou</span></div>
            
            <button class="btn btn-outline" onclick="entrarComoConvidado()">
                <i class="fas fa-user-secret"></i> Entrar como Convidado
            </button>
            
            <p style="text-align:center; margin-top:15px; font-size:12px; color:#bdc3c7;">
                Ao continuar, você aceita nossos <a href="#" style="color:#e67e22; text-decoration:none;">Termos</a>
            </p>
        </div>
        
        <!-- ==================== TAB REGISTO ==================== -->
        <div id="tabRegistro" class="tab-panel">
            <form id="formRegistro" onsubmit="event.preventDefault(); registrarUsuario();">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Nome Completo <span class="required">*</span></label>
                    <input type="text" id="regNome" placeholder="João Silva" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email <span class="required">*</span></label>
                    <input type="email" id="regEmail" placeholder="seu@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Senha <span class="required">*</span></label>
                    <input type="password" id="regSenha" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-check-circle"></i> Confirmar Senha <span class="required">*</span></label>
                    <input type="password" id="regSenhaConfirm" placeholder="Digite a senha novamente" required autocomplete="new-password">
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="termos">
                    <label for="termos">
                        Aceito os <a href="#" onclick="event.preventDefault(); alert('Termos de Serviço do ArrendaMoz');">Termos de Serviço</a> 
                        e a <a href="#" onclick="event.preventDefault(); alert('Política de Privacidade do ArrendaMoz');">Política de Privacidade</a>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary" id="btnRegistro">
                    <i class="fas fa-user-plus"></i> Criar Conta
                </button>
            </form>
        </div>
        
        <!-- ==================== CÓDIGO DE VERIFICAÇÃO ==================== -->
        <div id="codigoContainer" class="codigo-container">
            <div class="info-text">
                <i class="fas fa-shield-alt"></i>
                <strong>Verificação de segurança</strong><br>
                <span style="font-size:13px;">Insira o código de 5 dígitos enviado para seu email</span>
            </div>
            
            <div class="codigo-inputs" id="codigoInputs">
                <input type="text" maxlength="1" class="code-input" data-index="0" pattern="[0-9]" inputmode="numeric">
                <input type="text" maxlength="1" class="code-input" data-index="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" maxlength="1" class="code-input" data-index="2" pattern="[0-9]" inputmode="numeric">
                <input type="text" maxlength="1" class="code-input" data-index="3" pattern="[0-9]" inputmode="numeric">
                <input type="text" maxlength="1" class="code-input" data-index="4" pattern="[0-9]" inputmode="numeric">
            </div>
            
            <div class="timer">
                <i class="fas fa-clock"></i> Código expira em: <strong id="timerDisplay">10:00</strong>
            </div>
            
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn btn-secondary" onclick="reenviarCodigo()" style="flex:1;">
                    <i class="fas fa-redo"></i> Reenviar Código
                </button>
                <button class="btn btn-success" onclick="verificarCodigo()" style="flex:1;">
                    <i class="fas fa-check"></i> Verificar
                </button>
            </div>
            
            <div class="voltar-link">
                <a onclick="voltarLogin()">
                    <i class="fas fa-arrow-left"></i> Voltar ao login
                </a>
            </div>
        </div>
    </div>
    
    <script>
        // ==================== VARIÁVEIS ====================
        let modoAtual = 'login';
        let codigoEnviado = false;
        let timerInterval = null;
        let tempoRestante = 600;
        let emailVerificacao = '';
        let nomeVerificacao = '';
        
        // ==================== MUDAR TAB ====================
        function mudarTab(tab) {
            modoAtual = tab;
            
            // Atualizar tabs
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-auth button').forEach(b => b.classList.remove('active'));
            
            if (tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.querySelector('.tab-auth button[data-tab="login"]').classList.add('active');
                document.getElementById('codigoContainer').classList.remove('show');
            } else {
                document.getElementById('tabRegistro').classList.add('active');
                document.querySelector('.tab-auth button[data-tab="registro"]').classList.add('active');
            }
            
            limparMensagem();
        }
        
        // ==================== MOSTRAR MENSAGEM ====================
        function mostrarMensagem(texto, tipo = 'erro') {
            const msg = document.getElementById('mensagem');
            msg.textContent = texto;
            msg.className = 'mensagem ' + tipo;
            msg.style.display = 'block';
            
            // Auto-esconder após 5 segundos
            clearTimeout(msg._timeout);
            msg._timeout = setTimeout(() => {
                msg.style.display = 'none';
            }, 5000);
        }
        
        function limparMensagem() {
            const msg = document.getElementById('mensagem');
            msg.style.display = 'none';
            msg.className = 'mensagem';
            clearTimeout(msg._timeout);
        }
        
        // ==================== LOGIN ====================
        function loginUsuario() {
            const email = document.getElementById('loginEmail').value.trim();
            const senha = document.getElementById('loginSenha').value;
            const btn = document.getElementById('btnLogin');
            
            if (!email || !senha) {
                mostrarMensagem('Preencha todos os campos!', 'erro');
                return;
            }
            
            if (!email.includes('@')) {
                mostrarMensagem('Digite um email válido!', 'erro');
                return;
            }
            
            // Simular login (com localStorage)
            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> A entrar...';
                
                // Verificar se o usuário existe no localStorage
                const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
                const usuario = usuarios.find(u => u.email === email && u.senha === senha);
                
                if (usuario) {
                    // Login bem sucedido
                    localStorage.setItem('userEmail', email);
                    localStorage.setItem('userNome', usuario.nome || email.split('@')[0]);
                    localStorage.setItem('verificado', 'true');
                    
                    mostrarMensagem('✅ Login realizado com sucesso!', 'sucesso');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    // Verificar se é um usuário registrado que não confirmou
                    const registrado = usuarios.find(u => u.email === email);
                    if (registrado) {
                        mostrarMensagem('❌ Senha incorreta. Tente novamente.', 'erro');
                    } else {
                        mostrarMensagem('❌ Usuário não encontrado. Crie uma conta.', 'erro');
                    }
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar';
                }
                
            } catch (error) {
                console.error(error);
                mostrarMensagem('Erro ao entrar: ' + error.message, 'erro');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar';
            }
        }
        
        // ==================== REGISTO ====================
        function registrarUsuario() {
            const nome = document.getElementById('regNome').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const senha = document.getElementById('regSenha').value;
            const senhaConfirm = document.getElementById('regSenhaConfirm').value;
            const termos = document.getElementById('termos').checked;
            const btn = document.getElementById('btnRegistro');
            
            // Validações
            if (!nome || !email || !senha) {
                mostrarMensagem('Preencha todos os campos!', 'erro');
                return;
            }
            
            if (nome.length < 2) {
                mostrarMensagem('Digite seu nome completo.', 'erro');
                return;
            }
            
            if (!email.includes('@')) {
                mostrarMensagem('Digite um email válido.', 'erro');
                return;
            }
            
            if (senha.length < 6) {
                mostrarMensagem('A senha deve ter no mínimo 6 caracteres.', 'erro');
                return;
            }
            
            if (senha !== senhaConfirm) {
                mostrarMensagem('As senhas não coincidem!', 'erro');
                return;
            }
            
            if (!termos) {
                mostrarMensagem('Aceite os termos de serviço para continuar.', 'erro');
                return;
            }
            
            // Verificar se email já está registrado
            const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
            if (usuarios.find(u => u.email === email)) {
                mostrarMensagem('Este email já está registrado. Faça login.', 'erro');
                return;
            }
            
            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> A criar conta...';
                
                // Gerar código de 5 dígitos
                const codigo = Math.floor(10000 + Math.random() * 90000).toString();
                emailVerificacao = email;
                nomeVerificacao = nome;
                
                // Salvar código para verificação
                localStorage.setItem('codigoVerificacao', codigo);
                localStorage.setItem('emailVerificacao', email);
                localStorage.setItem('nomeVerificacao', nome);
                
                // Salvar usuário (mas ainda não ativo)
                const novoUsuario = {
                    email: email,
                    nome: nome,
                    senha: senha,
                    verificado: false,
                    created_at: new Date().toISOString()
                };
                usuarios.push(novoUsuario);
                localStorage.setItem('usuarios', JSON.stringify(usuarios));
                
                // Enviar código (simulação)
                enviarEmailVerificacao(email, codigo, nome);
                
                mostrarMensagem('✅ Código enviado! Verifique seu email.', 'sucesso');
                
                // Mostrar campo de código
                document.getElementById('codigoContainer').classList.add('show');
                iniciarTimer(600);
                
                // Limpar campos de senha por segurança
                document.getElementById('regSenha').value = '';
                document.getElementById('regSenhaConfirm').value = '';
                
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Criar Conta';
                
                // Focar no primeiro input do código
                document.querySelector('.code-input').focus();
                
            } catch (error) {
                console.error(error);
                mostrarMensagem('Erro ao criar conta: ' + error.message, 'erro');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Criar Conta';
            }
        }
        
        // ==================== VERIFICAR CÓDIGO ====================
        function verificarCodigo() {
            const inputs = document.querySelectorAll('.code-input');
            let codigoDigitado = '';
            inputs.forEach(input => codigoDigitado += input.value);
            
            if (codigoDigitado.length !== 5) {
                mostrarMensagem('Digite o código completo de 5 dígitos.', 'erro');
                return;
            }
            
            const codigoSalvo = localStorage.getItem('codigoVerificacao');
            const email = localStorage.getItem('emailVerificacao');
            const nome = localStorage.getItem('nomeVerificacao');
            
            if (codigoDigitado === codigoSalvo && email) {
                // Código correto - ativar usuário
                const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
                const usuario = usuarios.find(u => u.email === email);
                if (usuario) {
                    usuario.verificado = true;
                    localStorage.setItem('usuarios', JSON.stringify(usuarios));
                }
                
                // Salvar dados do usuário
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userNome', nome || email.split('@')[0]);
                localStorage.setItem('verificado', 'true');
                
                mostrarMensagem('✅ Conta verificada com sucesso!', 'sucesso');
                
                // Limpar código
                localStorage.removeItem('codigoVerificacao');
                localStorage.removeItem('emailVerificacao');
                localStorage.removeItem('nomeVerificacao');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
            } else {
                mostrarMensagem('❌ Código inválido. Tente novamente.', 'erro');
                
                // Limpar inputs
                document.querySelectorAll('.code-input').forEach(inp => inp.value = '');
                document.querySelector('.code-input').focus();
            }
        }
        
        // ==================== REENVIAR CÓDIGO ====================
        function reenviarCodigo() {
            const email = localStorage.getItem('emailVerificacao');
            const nome = localStorage.getItem('nomeVerificacao') || 'Usuário';
            
            if (!email) {
                mostrarMensagem('Email não encontrado. Tente criar conta novamente.', 'erro');
                return;
            }
            
            const codigo = Math.floor(10000 + Math.random() * 90000).toString();
            localStorage.setItem('codigoVerificacao', codigo);
            
            enviarEmailVerificacao(email, codigo, nome);
            mostrarMensagem('✅ Novo código enviado!', 'sucesso');
            
            // Resetar timer
            iniciarTimer(600);
            
            // Limpar inputs
            document.querySelectorAll('.code-input').forEach(inp => inp.value = '');
            document.querySelector('.code-input').focus();
        }
        
        // ==================== ENVIAR EMAIL ====================
        function enviarEmailVerificacao(email, codigo, nome) {
            // Simulação - em produção, usar API real
            console.log('📧 ===== ENVIO DE EMAIL =====');
            console.log(`Para: ${email}`);
            console.log(`Nome: ${nome}`);
            console.log(`Código: ${codigo}`);
            console.log('📧 ==========================');
            
            // Mostrar código na tela para desenvolvimento (apenas se não estiver em produção)
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                mostrarMensagem(`📧 [DEV] Código: ${codigo}`, 'info');
            }
        }
        
        // ==================== TIMER ====================
        function iniciarTimer(segundos) {
            tempoRestante = segundos;
            clearInterval(timerInterval);
            
            const timerDisplay = document.getElementById('timerDisplay');
            
            timerInterval = setInterval(() => {
                tempoRestante--;
                const mins = Math.floor(tempoRestante / 60);
                const secs = tempoRestante % 60;
                timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                
                if (tempoRestante <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.textContent = '⏰ Expirado!';
                    document.querySelectorAll('.code-input').forEach(inp => inp.disabled = true);
                }
            }, 1000);
        }
        
        // ==================== AUTO-FOCUS CÓDIGO ====================
        function setupCodigoInputs() {
            const inputs = document.querySelectorAll('.code-input');
            
            inputs.forEach((input, index, allInputs) => {
                // Apenas números
                input.addEventListener('input', function(e) {
                    this.value = this.value.replace(/[^0-9]/g, '');
                    
                    // Avançar para o próximo input
                    if (this.value.length === 1 && index < allInputs.length - 1) {
                        allInputs[index + 1].focus();
                    }
                    
                    // Verificar automaticamente quando todos os campos estão preenchidos
                    const todosPreenchidos = Array.from(allInputs).every(inp => inp.value.length === 1);
                    if (todosPreenchidos) {
                        setTimeout(verificarCodigo, 300);
                    }
                });
                
                // Voltar com backspace
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value === '' && index > 0) {
                        allInputs[index - 1].focus();
                    }
                    if (e.key === 'Enter') {
                        verificarCodigo();
                    }
                });
                
                // Colar código
                input.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const pasted = (e.clipboardData || window.clipboardData).getData('text');
                    const digits = pasted.replace(/[^0-9]/g, '').slice(0, 5);
                    
                    digits.split('').forEach((digit, i) => {
                        if (i < allInputs.length) {
                            allInputs[i].value = digit;
                        }
                    });
                    
                    const nextIndex = Math.min(digits.length, allInputs.length - 1);
                    allInputs[nextIndex].focus();
                    
                    // Verificar automaticamente se todos foram preenchidos
                    const todosPreenchidos = Array.from(allInputs).every(inp => inp.value.length === 1);
                    if (todosPreenchidos && digits.length === 5) {
                        setTimeout(verificarCodigo, 300);
                    }
                });
                
                // Focar automaticamente
                input.addEventListener('focus', function() {
                    this.select();
                });
            });
        }
        
        // ==================== ENTRAR COMO CONVIDADO ====================
        function entrarComoConvidado() {
            localStorage.setItem('modoConvidado', 'true');
            localStorage.setItem('userNome', 'Convidado');
            localStorage.setItem('userEmail', 'convidado@arrendamoz.com');
            localStorage.setItem('verificado', 'true');
            window.location.href = 'dashboard.html';
        }
        
        // ==================== VOLTAR AO LOGIN ====================
        function voltarLogin() {
            document.getElementById('codigoContainer').classList.remove('show');
            mudarTab('login');
            limparMensagem();
            
            // Limpar inputs do código
            document.querySelectorAll('.code-input').forEach(inp => {
                inp.value = '';
                inp.disabled = false;
            });
            
            // Limpar timer
            clearInterval(timerInterval);
            document.getElementById('timerDisplay').textContent = '10:00';
            
            // Limpar dados de verificação
            localStorage.removeItem('codigoVerificacao');
            localStorage.removeItem('emailVerificacao');
            localStorage.removeItem('nomeVerificacao');
        }
        
        // ==================== VERIFICAR SESSÃO EXISTENTE ====================
        function verificarSessao() {
            const userEmail = localStorage.getItem('userEmail');
            const modoConvidado = localStorage.getItem('modoConvidado') === 'true';
            const verificado = localStorage.getItem('verificado') === 'true';
            
            // Se já está logado, redirecionar para o dashboard
            if ((userEmail || modoConvidado) && verificado) {
                window.location.href = 'dashboard.html';
            }
        }
        
        // ==================== INICIALIZAÇÃO ====================
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar sessão existente
            verificarSessao();
            
            // Configurar inputs do código
            setupCodigoInputs();
            
            // Configurar Enter nos formulários
            document.getElementById('formLogin').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    loginUsuario();
                }
            });
            
            document.getElementById('formRegistro').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    registrarUsuario();
                }
            });
            
            // Pré-preencher para desenvolvimento (remover em produção)
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                document.getElementById('loginEmail').value = 'teste@email.com';
                document.getElementById('loginSenha').value = '123456';
                document.getElementById('regNome').value = 'Usuário Teste';
                document.getElementById('regEmail').value = 'teste@email.com';
                document.getElementById('regSenha').value = '123456';
                document.getElementById('regSenhaConfirm').value = '123456';
                document.getElementById('termos').checked = true;
            }
        });
    </script>
